# AI-assisted: drafted with Claude (Anthropic), reviewed by the team. License: Apache-2.0
#
# Builds the offline-first UI app (ui/app) with the bundled ML output (outputs/ui) and publishes
# it on GitHub Pages: a public link that needs no login. One-time setup in the repository:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/app/package-lock.json
      - name: Install and build
        working-directory: ui/app
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
