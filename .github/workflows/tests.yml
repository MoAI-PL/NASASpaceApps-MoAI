# Astrobalance — NASA Space Apps Challenge 2026
# AI-assisted: drafted with Claude (Anthropic), reviewed by the team. License: Apache-2.0
#
# Runs the test suite on every push and pull request, on Linux and Windows (the project must run
# on both, CLAUDE.md). The tests need no internet and no PyTorch (torch is imported lazily, only
# by the alternative autoencoder detector), so CI installs the light dependencies only.
# The one-time hold-out test (S5) is never run here: tests only check that it refuses a re-run.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install numpy pandas matplotlib pyyaml requests "jsonschema>=4.18" pytest
      - name: Run tests
        run: python -m pytest -q

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/app/package-lock.json
      - name: Install and build
        working-directory: ui/app
        run: |
          npm ci
          npm run build
